name: tts_text_mp3_mobile
description: Android and iOS client for TTS Text to MP3.
publish_to: none
version: 0.1.5+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  charset_converter: ^2.5.1
  cupertino_icons: ^1.0.8
  epubx: ^4.0.0
  file_picker: ^10.0.0
  flutter_edge_tts: ^0.0.2
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  just_audio: ^0.9.46
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
